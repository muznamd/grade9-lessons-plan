o a talk and complete sentences/notes, watching out for distractors;"], ["li", "use the -ing form as a subject and after prepositions;"], ["li", "role-play an interview with an animal."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "the -ing form as subject and after prepositions (Running is the best Saturday morning activity. I’m looking forward to going…)"], ["li", "communicating with animals."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board and explain what students will do. Ask students to think about the animals they would like to communicate with, and why."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Personalised pair work; predicting; gist listening"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Pairs share ideas about how people communicate with animals (e.g. horses understand commands; cats respond to slow blinking)."], ["p", "Ex 2 (2.03): Elicit which animals might be mentioned; play Mudrik’s talk and check (horses, dolphins, elephants)."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p30; Audio 2.03"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Exam-task strategy: study tip; identifying word types"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3: Read the study tip; students decide what kind of word is missing in each gap (a number, a noun, etc.). Support: an article before a gap suggests a noun; words like date/price/cost suggest a number. Class feedback."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3; PG p81 (walkthrough p80)"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening for specific information; noticing distractors; pair checking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4 (2.03): Ask how many words to write (one or two words or a number, as the instructions say). Play the recording."], ["p", "Ex 5 (2.03): Remind students of distractors; play again; pairs compare; class feedback; replay challenging parts (answers: 12, the wild, body language, (the) nets, sounds, respect)."], ["h2", "Time", "#C25E00"], ["p", "9 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 2.03; SB Ex 4–5"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive grammar; controlled practice"], ["h2", "Activity", "#2F6FED"], ["p", "Explore grammar: write the two example sentences; underline the -ing form; ask what kind of verb it is and why it is used (as subject; after a preposition). Students read the box; refer to the grammar reference on SB p54."], ["p", "Ex 6: students read the article about animals (sperm whales, cats) and fill the gaps; monitor use of the -ing form."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6; Grammar file SB pp54–55"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Planning notes; role-play; peer speaking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7 – Speak: Give a few minutes to plan and make notes (write new words on the board). In pairs, students role-play interviewing their animal (e.g. a cat: What do you think of humans?)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7; Fun footer"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "To check understanding of the -ing form, write two gapped sentences: ___ is the best Saturday morning activity. / I’m really looking forward to ___ next weekend. Pairs suggest words (Running; going to the cinema)."], ["h2", "Remedial (stronger classes)", "#D63A72"], ["p", "students complete the WB sentences before listening; Grammar file Exs 6–7 on SB p55 for extra practice (spelling of -ing forms: drive – driving; travel – travelling)."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Pairs share ideas; check the answer"], ["h2", "Activity 2", "#D63A72"], ["p", "Class feedback on word type"], ["h2", "Activity 3", "#D63A72"], ["p", "Pair comparison; class feedback"], ["h2", "Activity 4", "#D63A72"], ["p", "Monitor use of the -ing form"], ["h2", "Activity 5", "#D63A72"], ["p", "Peer learning – pair work"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Groups discuss which animals have the most ‘personality’ and give examples of how they show it (e.g. a cat purrs when relaxed; a horse bows its head to show respect); each group shares its ideas."], ["h2", "Reflect on learning", "#E5504D"], ["p", "On a scale of 1–5, how confident do you feel about the note completion task? How can you practise outside class?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p24 (Exs 1–5: W2.03 listening, word types, gap-fill, -ing form, own sentences)."], ["li", "Grammar file SB pp54–55 (Exs 6–7)."], ["li", "Practice Guide p81 (sentence or note completion)."]]}]}, {"n": "Lesson 5 – Speaking", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "CONNECTIONS"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 5 – Speaking"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "speak at length with few pauses and little hesitation (fluency);"], ["li", "organise a description of a photo (place, objects, people, feelings, clothes, background);"], ["li", "use phrases to describe and speculate about photos;"], ["li", "complete the individual long turn practice task."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "describing a photo – This photo shows…, In this photo there are…, I guess this photo was taken in…, In the background…, on the left/right, I think they’re probably…, definitely"], ["li", "speaking fluently."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board and explain what students will do. Students write a list of people they usually speak to each day. In pairs they tell each other about three of them and what they usually talk about. One or two pairs tell the class."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Personalised discussion; giving reasons and examples"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Check the meaning of queue. Pairs discuss the questions, trying to give a reason and an example for each answer. One or two students share what they learnt about their partner."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p31"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Defining fluency; teacher modelling; self-assessment by recording"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2: Tell students that one speaking skill is to speak at length and fluently. Establish that fluent does not mean fast – it means few pauses, little hesitation or repetition. Demonstrate, give time to choose a topic, then students speak (and record themselves if possible) and listen back to assess fluency."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 2; phones/recording device"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Noticing useful language; planning notes; pair comparison"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 – Explore language: go through the stages of describing a photo. Students make notes on photo A (place, objects, people/feelings, clothes) and compare in pairs."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3, explore language box (photo A)"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening to a model; improving an answer"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4 (2.04): Read the study tip and ask if it is helpful. Play the recording (twice if needed); pairs discuss how the student could improve her answer (describe people and clothes, more objects, the background)."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 2.04; SB Ex 4"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Individual long turn; peer speaking; recording; self-assessment"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5 (practice task): Put students in A/B pairs: A plans to describe the photo on p58, B the photo on p31 (make higher-ability students A). Students describe their photos (recording if possible). Monitor fluency and organisation of ideas; students self-assess; give feedback and elicit corrections."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5, pp31, 58; PG p85 (walkthrough p84)"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Personal storytelling; using past tenses; error correction"], ["h2", "Activity", "#2F6FED"], ["p", "Speaking extra (Ex 6): Demonstrate telling a story about a conversation with a stranger; highlight the past simple and past continuous. Students plan, then tell stories in small groups. Monitor past tenses; one or two groups share their best story; deal with errors."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "Additional Speaking practice task on SB p60 – pairs take turns to describe their photos, using the language of the lesson; note errors and good language. Digital classroom: students practise speaking for one minute on topics of interest at home, recording themselves and listening back."], ["h2", "Remedial", "#D63A72"], ["p", "students tick off the explore language phrases their partner uses (alternative activity) to see how many they can each manage; model answers are in the Teacher’s Book."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Class sharing"], ["h2", "Activity 2", "#D63A72"], ["p", "Self-assessment of fluency; class feedback on the task"], ["h2", "Activity 3", "#D63A72"], ["p", "Pairs compare notes"], ["h2", "Activity 4", "#D63A72"], ["p", "Pair discussion; check the answer with the class"], ["h2", "Activity 5", "#D63A72"], ["p", "Monitoring – Speak (Ex 5); self-assessment"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – use of past tenses"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Students think about a favourite photo (they may bring it, but must not show it). In pairs they take turns describing it for one minute; partners listen and visualise it or draw what they hear."], ["h2", "Reflect on learning", "#E5504D"], ["p", "On a scale of 1–5, how confident do you feel about the long turn task? How can you practise this more?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p25 (Exs 1–6: jumbled sentences, photo description W2.04, useful phrases, describe the photo on p16 – record if possible)."], ["li", "Practice Guide p85 (individual long turn)."], ["li", "Photocopiable 2C."], ["li", "Think of ideas for a story for the next lesson."]]}]}, {"n": "Lesson 6 – Writing", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "CONNECTIONS"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 6 – Writing"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "correct common errors with prepositions and describe social-media posts;"], ["li", "read a model story and identify past simple and past continuous;"], ["li", "use strong adjectives and adverbs to create an atmosphere;"], ["li", "plan, write and improve a story of about 100 words that begins with a given sentence."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "strong adjectives (brilliant, fantastic, miserable, hilarious, disgusting, huge, delicious) and strong adverbs (absolutely, really)"], ["li", "past simple and past continuous in narrative."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. On the board write happy, embarrassed, exhausted, excited, nervous, scared. In small groups students discuss what makes them feel each of those things (e.g. I feel exhausted after a big test)."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Personalised discussion; error correction; inferring"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Pairs discuss the questions; a few share."], ["p", "Ex 2: The errors are with prepositions; students correct and compare with a partner; feedback."], ["p", "Ex 3: Pairs decide what each social media post shows (e.g. a selfie on a beach; someone baking a cake)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB pp32–33"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Describing a photo; noticing tense use in a model"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4: Students read and think about the photo, then share ideas in pairs; a few share with the class."], ["p", "Ex 5: Students answer the questions alone, then discuss in pairs; review the form of the past continuous (Grammar file SB p54). Ex 6: read the story quickly – has anyone had a similar experience?"], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 4–6; Grammar file SB p54"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Controlled practice; inductive language work"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7: do question 1 together; students check the rest in pairs. Ex 8 – Explore language: ask why the writer chose miserable, not sad (stronger adjective); read the explore language box; check pronunciation; elicit weaker synonyms (awful – bad)."], ["p", "Ex 9: replace the adjectives with strong ones (very funny = hilarious, very bad = disgusting, really big = huge…). Read the Fun footer (false friends)."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7–9"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Oral rehearsal; storytelling with a new partner"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 10: Give time to prepare a story, thinking about the tenses and adjectives they will use. In different pairs, students tell their stories; one or two share their partner’s story; highlight good past tenses and strong adjectives; elicit corrections."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 10"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Model-based planning; study tip; ordering ideas"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 11 – Plan and write: students complete the task about the story on p32 (first/at the beginning; 100 words; your English teacher)."], ["p", "Ex 12: continue the first line, then write a middle and an end; read the study tip; use prompts if needed (When was this? What happened in the end?)."], ["p", "Ex 13: choose a sentence starter; note answers; decide what to put at the beginning, middle and end; think of strong adjectives."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 11–13"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guided writing; monitoring; eliciting corrections"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 14 (practice task – a story): students write their story in class or for homework. If in class, monitor and offer suggestions or elicit corrections; help students see what they are doing right. Ex 15 – Improve it: self-check and peer feedback."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 14–15; PG p75 (walkthrough p74)"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "Fast finishers talk about a time when they used the wrong words by mistake (in another language or their own). Digital classroom: students find the photo they described and show it to their partner."], ["h2", "Remedial / mixed ability", "#D63A72"], ["p", "higher-ability students cover the words in the Ex 9 box and replace the adjectives with their own ideas; lower-ability students use prompts to plan their story."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Pair comparison; class feedback"], ["h2", "Activity 2", "#D63A72"], ["p", "Class feedback (past simple / past continuous)"], ["h2", "Activity 3", "#D63A72"], ["p", "Class feedback on answers"], ["h2", "Activity 4", "#D63A72"], ["p", "Peer learning – pair work; monitor"], ["h2", "Activity 5", "#D63A72"], ["p", "Class feedback; monitor plans"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – Ex 14; Improve it (Ex 15)"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "In small groups students tell each other their stories, from memory if possible (lower-ability students may read their text aloud). Listeners find three things the stories have in common other than the first line; class feedback. Reflect on learning (WB): What new vocabulary did you learn? How might you use it?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Finish the story (Ex 14) and Improve it (Ex 15) – teacher marks focusing on Content, Organisation (extending ideas logically) and Language (past tenses, adjectives)."], ["li", "Workbook p26 (Exs 1–5)."], ["li", "Practice Guide p75."], ["li", "Photocopiable 2D."]]}]}, {"n": "Lesson 7 – Switch On", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "CONNECTIONS"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 7 – Switch On"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "talk about their own phone use and give reasons;"], ["li", "watch video interviews and identify key details;"], ["li", "hear and pronounce the difference between I, I’d and I’ll;"], ["li", "work in a group to prepare and give a presentation about a typical day in the 1980s."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "I feel like my life would be…"], ["li", "I’d probably…"], ["li", "I’ll just…"], ["li", "talking about communication without phones."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Ex 1: Introduce the topic by telling the class about your own phone use (e.g. I use my phone all the time when I’m not doing something else…). Organise students into small groups to discuss the questions. Elicit each group’s average time on their phones and what they use it for."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Predicting; comparing with own ideas"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2 – View: Read the question in the View box; play the video for students to watch and compare with their ideas from Ex 1."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p34; Video Unit 2"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening for detail; pair checking; replaying the video"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3: Give a minute to read the questions. Play the video again for students to answer; check in pairs; replay if needed; check with the whole class (1 Sofija, 2 Ethan, 3 Aisha, 4 Maxwell, 5 Zoe, 6 Jack, 7 Maxwell, 8 Sophie)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Video Unit 2; SB Ex 3"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Discussion with reasons; inference"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4: Pairs discuss the questions; monitor and encourage reasons. Elicit answers from a few students and hold a brief class discussion."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 4"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Noticing pronunciation; repetition drill; listening to complete"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5 (2.05): Students listen and note whether there is a big or small difference in pronunciation (a small difference); replay, pausing for students to repeat."], ["p", "Ex 6 (2.06): listen and complete with I, I’d, I’ll; check in pairs; replay if needed. Extra: pairs say a sentence using I, I’d or I’ll and their partner says which form was used."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 2.05, 2.06; SB Ex 5–6"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Group discussion; giving views"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7 – Speak: Small groups discuss the questions; a few pairs share their ideas with the class and find out if others agree."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Project-based learning; research; group presentation"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 8 – Project: Arrange groups; read the steps and check students know what to do. Step 1: search online for How did people (communicate) in the 1980s? In step 3 students decide who presents what; monitor and write new vocabulary on the board. Groups present; other groups think of questions and ask them at the end."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 8; internet access; board"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment – Extended project", "#7B5CE6"], ["p", "each group chooses one question from Ex 8 step 1 and creates a short video acting out the situation. For homework they research how people did this in the 1980s (ask family members who remember, or search online). Next class they plan scenes and write the script; they find 1980s clothes/props; in the final class they film their scenes and show them to the class."], ["h2", "Remedial", "#D63A72"], ["p", "replay the video after each speaker; pause and repeat contraction sentences."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Compare with Ex 1; class feedback"], ["h2", "Activity 2", "#D63A72"], ["p", "Pairs check; whole-class check"], ["h2", "Activity 3", "#D63A72"], ["p", "Class discussion"], ["h2", "Activity 4", "#D63A72"], ["p", "Pairs check; class check of contractions"], ["h2", "Activity 5", "#D63A72"], ["p", "Peer learning – group work"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – Project (Ex 8); questions from other groups"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Groups finish and give their presentations; other groups ask questions. Recap what students learnt about communication in the 1980s."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Extended project: research how people communicated in the 1980s (ask family members or search online)."], ["li", "For the next lesson, find clothes, styles or props from the 1980s for the video."]]}]}, {"n": "Lesson 8 – Unit check", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "CONNECTIONS"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 8 – Unit check"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "review the language and grammar of Unit 2 (Connections);"], ["li", "choose and form the correct past simple/continuous and distinguish state and action verbs;"], ["li", "check vocabulary and collocations by listening (2.07, 2.08, 2.09);"], ["li", "complete an open-cloze practice task and write a short text."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "past simple and past continuous"], ["li", "state and action verbs"], ["li", "-ing form"], ["li", "communication verbs (say, tell, speak, talk, listen, hear, explain, translate, pronounce, repeat)"], ["li", "ancient, local, dream, occurs, grow up, receive."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Ask students to tell you three things they do every week and one thing they are doing now. Demonstrate by talking about yourself first (e.g. Every week, I play tennis on Saturdays…). Praise all good answers."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Revision; independent work then class feedback"], ["h2", "Activity", "#2F6FED"], ["p", "Review Ex 1–3: Students choose the correct past simple/past continuous forms, form questions, and classify verbs as state or action (state: believe, hate, like, want; action: decide, look forward to, stop, watch). Check answers with the class."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB pp35–36 Review; Grammar file SB pp54–55"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Completing a dialogue; listening to check"], ["h2", "Activity", "#2F6FED"], ["p", "Review Ex 4–5 (2.09): Students complete the conversation about a class presentation with the correct past forms (hated, was giving, wanted, thought, were speaking, was enjoying, said, didn’t believe) and listen to check."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Review Ex 4–5; Audio 2.09"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Exam-task practice; explaining answers"], ["h2", "Activity", "#2F6FED"], ["p", "Review Ex 6 (practice task – open cloze): students complete the gapped text with one word in each gap; check and explain why each answer is correct (did, was, on, up, tell, to)."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Review Ex 6"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guided free writing; monitoring"], ["h2", "Activity", "#2F6FED"], ["p", "Review Ex 7: Students write their own answers (a short personal text using the language of the unit). Monitor and note strengths and errors for feedback."] #E5504D"], ["p", "students look back through the unit and choose the most useful grammar point, three most useful vocabulary items and the most interesting piece of information; compare in pairs."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Finish the Practice exercises for revision."], ["li", "Workbook p27 (Exs 1–6: past tense gap-fill, questions, error correction, matching, communication verbs, social media post)."], ["li", "Grammar file SB p55."], ["li", "Revise for the Unit 2 test."]]}]}]}, {"n": "The Future Is Now", "l": [{"n": "Lesson 1 – Reading", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "THE FUTURE IS NOW"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 1 – Reading"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "skim-read an article to identify its main ideas;"], ["li", "complete a gapped text by choosing the correct missing sentences;"], ["li", "learn and use new words and their word forms (transform, regularly, preference, version, create, lifelike, consume, challenge);"], ["li", "give opinions about the future of entertainment and present an idea."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "vocabulary of entertainment and AI – transform, regularly, preference, version, create, lifelike, consume, challenge"], ["li", "predictions about the future of entertainment."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Closed books. Give students four choices (e.g. going shopping / playing sport / going to the beach / staying at home). Allocate one corner of the room to each choice; students stand in the corner of their choice and explain their reasons to a partner there. One student from each corner justifies the choice to the class. (If moving is not possible, students work in pairs.)"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Visual prompts; pair discussion"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Focus on the photo and elicit what students can see. Pairs discuss the questions (recent film, book, and how they watch films). Class feedback."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Student’s Book (SB) pp37–39"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Predicting from a title; making predictions about the future"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2: Give time to read the questions; students think how things might be better, worse, faster, easier. Ask for ideas in open class (the text is about the future of entertainment)."], ["h2", "Time", "#C25E00"], ["p", "3 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 2"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Skimming strategy; hands-up survey; reflecting on technique"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3: Read the study tip. Use ‘hands up’ to see who will use the first method and who the second. Students skim and answer; check with the class. Pairs discuss if their technique helped; share ideas in open class. (Audio version available.)"], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3; PG p69 (walkthrough p68)"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Exam-task strategy: gapped text; linking words and ideas; pair checking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4 (practice task – gapped text): Students complete gap 1 first; conduct feedback to check everyone understands the task; then finish the task and check in pairs. Class feedback on links (e.g. virtual influencers is an example of Such characters). Remind students that three sentences do not fit."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 4; PG p69"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Working out word meaning from definitions; word building"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5: Students read the definitions and work out what kind of word is needed; find the words (transform, regularly, preference, version, create, lifelike, consume, challenge). Check pronunciation; elicit other forms (transformation, regular, creation, creative)."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Summarising in own words; giving opinions with reasons; group creativity"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6 – Sum up: Discuss as a class, then students write an explanation in their own words using information from the article."], ["p", "Ex 7–8 – Speak: Refer pairs to the three main themes; prompts: … would be good because … / One problem with this would be … because … . In groups students brainstorm ideas for Ex 8, choose the best one and present it; vote for the best idea (not their own). Read the Fun footer."], ["h2", "Time", "#C25E00"], ["p", "10 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6–8; Fun footer"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment / mixed ability", "#7B5CE6"], ["p", "Tell lower-ability students that sentences B, E and G do not fit any of the gaps, so they can cross them out; in later practice remove one or two distractors at a time until they are confident. Write prompts on the board (Style of film / Social media characters / Produce films / Write stories) to help lower-ability students summarise. Extra: compare their own predictions about entertainment with the article."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Class feedback"], ["h2", "Activity 2", "#D63A72"], ["p", "Ideas elicited in open class"], ["h2", "Activity 3", "#D63A72"], ["p", "Peer learning – pair work; class discussion"], ["h2", "Activity 4", "#D63A72"], ["p", "Pairs check; class feedback with reasons"], ["h2", "Activity 5", "#D63A72"], ["p", "Class feedback; pronunciation check"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – Sum up (Ex 6) and Speak (Ex 7, 8)"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Closed books. Students work in pairs and choose two topics (A sports star I’d like to meet / A book I really like / A play I’ve been to / A type of film I can’t stand / Why I’m not very interested in video games) and take turns speaking about each for at least thirty seconds."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What was the most interesting thing you learnt? What else would you like to find out?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook pp28–29 (Exs 1–6: vocabulary gap-fill; Robot doctors article – skim, gapped sentences, true/false; word definitions)."], ["li", "Practice Guide p69 (gapped text)."], ["li", "Flipped classroom: share the Unit 3 grammar presentation slides for the next lesson."]]}]}, {"n": "Lesson 2 – Grammar", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "THE FUTURE IS NOW"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 2 – Grammar"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "choose the correct future form for predictions, intentions, arrangements, decisions and scheduled events;"], ["li", "identify future forms in a recording and explain why each is used;"], ["li", "use future forms accurately in speaking;"], ["li", "talk about plans, arrangements and predictions."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "will (predictions from opinion; offers/immediate decisions)"], ["li", "be going to (intentions; predictions from evidence)"], ["li", "present continuous (arrangements)"], ["li", "present simple (scheduled events)"], ["li", "advice and suggestions."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Closed books. In pairs students discuss their plans for the evening, the next day or the following weekend. Monitor and assess their use of future forms to identify strengths and weak areas."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Recalling previous learning; predicting"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Remind students of the article on the future of entertainment and elicit what they remember. Discuss the question as a class (e.g. AI is going to change films; people will make their own films using AI)."], ["h2", "Time", "#C25E00"], ["p", "3 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p40"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive grammar: identify, match, explain use and form"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2 – Explore grammar: Students identify the future form in bold in each sentence and say why it is used, then read the grammar box (SB p56) and do the task. Make sure they are clear about the use and form of each future form (present simple – scheduled events; present continuous – arrangements; will – predictions/immediate decisions; be going to – intentions/predictions from evidence)."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", 6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "Digital classroom – students record themselves; after Ex 5 (and before Ex 6) they listen back to their discussion, assess their use of future forms and identify weak areas."], ["h2", "Remedial / mixed ability", "#D63A72"], ["p", "lower-ability students find the Ex 2 sentences in the article on p39 for context; elicit follow-up questions for each Ex 6 prompt and note them on the board (Why will you do that? Who are you doing it with? When are you going to do that?). Flipped classroom: begin with a review of the slides, then spend most of the time on practice."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Class discussion"], ["h2", "Activity 2", "#D63A72"], ["p", "Class check of answers (Ex 2)"], ["h2", "Activity 3", "#D63A72"], ["p", "Class feedback"], ["h2", "Activity 4", "#D63A72"], ["p", "Class feedback; students justify choices"], ["h2", "Activity 5", "#D63A72"], ["p", "Class feedback"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – Speak (Ex 6); peer learning"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Students write three sentences about next week – an arrangement, an intention and a prediction, different from Ex 6 (true or false). They read them to a partner, who asks follow-up questions to decide if they are true or false."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What new things did you learn about future forms? How will you use them?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p30 (Exs 1–6: jumbled sentences, will/present continuous, W3.01 conversation, intentions, paragraph about the future)."], ["li", "Grammar file SB pp56–57 (Exs 1–4)."], ["li", "Photocopiable 3A."]]}]}, {"n": "Lesson 3 – Vocabulary", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "THE FUTURE IS NOW"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 3 – Vocabulary"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "name technology and household appliances in the home;"], ["li", "understand and use phrasal verbs, including separable and inseparable ones;"], ["li", "complete a multiple-choice cloze practice task;"], ["li", "talk about smart devices and how they could solve problems at home."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "kettle, microwave, TV, fridge-freezer, washing machine, dishwasher, coffee maker, speaker, air conditioning"], ["li", "switch on/off, turn up/down, plug in, set up, go off, come on, connect to."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. In teams, students have two minutes to note down as many examples of technology in the home as possible. The team with the most words reads them out so the class can check; if correct, they win."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Labelling photos; pronunciation and word stress"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Students label the photos with the words in the box (higher-ability students cover the box first). Check answers; help with pronunciation and word stress in each word/phrase."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p41"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Pair discussion; reaching agreement"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2: Pairs discuss and try to agree on the answers. Elicit answers from a few pairs and find out if others agree."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 2"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Defining phrasal verbs; matching; pronunciation"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 – Explore language: Ask what a phrasal verb is (a verb + a particle, adverb or preposition). Students do the task and compare in pairs; check with the class. Help with pronunciation – the particle is usually stressed (turn up, switch off)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive grammar: separable and inseparable phrasal verbs"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4: Ask if there is any difference in how the phrasal verbs are formed; students read the explore language box and complete the task (all separable except go off and come on). Extra: Elicit which sentence is incorrect: take off them / take off your shoes / take your shoes off (the pronoun must go between the verb and particle)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 4; board"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Modelling with a confident student; personalised speaking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5: Demonstrate with a confident student (e.g. Yes, I always remember to switch off the lights). Pairs talk using the phrasal verbs from Ex 3. Monitor; one or two pairs share; elicit corrections to errors."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Predicting; exam-task strategy; explaining answers"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6 (practice task – multiple-choice cloze): Students read the title and predict the article, then read to check. Check central heating and air conditioning. Complete the task; pairs explain their answers; class feedback (why the other options do not fit)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6; PG p71 (walkthrough p70)"], ["h1", "Activity 7", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Problem-solving; group presentation"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7 – Speak: Pairs think of a problem at home they would like to solve with a new smart machine or device; read the example; discuss the questions; each pair presents its ideas to the class."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7; Fun footer"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment / game", "#7B5CE6"], ["p", "Draw a picture on the board that explains a word or phrasal verb (e.g. plug and socket → plug in); students guess; in pairs or teams they take turns to draw and guess, one point per correct guess."], ["h2", "Remedial / mixed ability", "#D63A72"], ["p", "lower-ability students talk only about the Ex 5 sentences that are true for them; fast finishers discuss those that aren’t true and why; fast finishers discuss the meanings of the incorrect Ex 6 phrasal verbs (get on, try on, keep on)."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Class check of answers and stress"], ["h2", "Activity 2", "#D63A72"], ["p", "Peer learning – pair work; class feedback"], ["h2", "Activity 3", "#D63A72"], ["p", "Pairs compare; class feedback"], ["h2", "Activity 4", "#D63A72"], ["p", "Class feedback – why the sentence is incorrect"], ["h2", "Activity 5", "#D63A72"], ["p", "Monitoring – phrasal verb use"], ["h2", "Activity 6", "#D63A72"], ["p", "Pairs explain answers; class feedback"], ["h2", "Activity 7", "#D63A72"], ["p", "Monitoring – Speak (Ex 7); peer learning"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Pairs or groups discuss: How smart is your home? How smart would you like your home to be? Why? What do you think our homes will be like in thirty years? A few students answer in open class."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What new phrasal verbs did you learn? How will you record them?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p31 (Exs 1–7: compound nouns, photo gap-fill, phrasal verbs, W3.02 listening, blog multiple choice, own sentences)."], ["li", "Practice Guide p71 (multiple-choice cloze)."], ["li", "Photocopiable 3B."]]}]}, {"n": "Lesson 4 – Listening", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "THE FUTURE IS NOW"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 4 – Listening"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "predict the words they will hear from pictures and identify differences between similar options;"], ["li", "listen to seven short conversations and choose the correct picture;"], ["li", "give advice and make suggestions with should, ought to, could, Why don’t you, Shall we and How about;"], ["li", "role-play a conversation asking for and giving advice."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "advice and suggestions – should, shouldn’t, ought to, could, Why don’t you…?, Shall I/we…?, How about + noun/-ing"], ["li", "technology and devices."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. In pairs students talk about their favourite piece of technology: what it is, what they use it for, why they like it."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Hands-up survey; predicting from pictures; exam-task study tip"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Ask what students can see in question 1 (a tablet, a smartphone, a smart watch); pairs discuss; hands-up survey to find which item most students have and why."], ["p", "Ex 2: Read the study tip; pairs predict the words they will hear (1 minute); class feedback (the conversation is about buying something new)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p42"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening for specific information; distractors; pictures"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 (3.02 – practice task): Students repeat the Ex 2 approach for questions 2–7; make sure they know what each picture shows (printer / games controller / laptop; speaker / headphones / earbuds…). Remind students that all three items will be mentioned but only one is correct. Play the recording."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 3.02; SB Ex 3; PG p77 (walkthrough p76)"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Pair comparison; using the audioscript to identify distractors"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4 (3.02): Play the recording a second time; pairs compare answers; replay parts students disagree on, keeping the audioscript visible so they can find the distractors. Check answers with the class."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 3.02; audioscript"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive grammar; modelling pronunciation"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5 – Explore grammar: Ask in which conversations advice/suggestions were given (1, 2, 4, 5, 6); elicit typical language; students read the explore grammar box and answer the question (How about + noun/-ing). Model pronunciation of each example. Watch out for: shouldn’t (ought not to is uncommon); Why don’t you…? and How about…? end with a question mark."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5; Grammar file SB p56 (Exs 5–7 p57)"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Controlled practice; pair checking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6: Elicit the answer to the first gap; students complete the conversation alone, check with a partner; class feedback on incorrect answers (should/shall, shouldn’t, could, ought, don’t, Shall/How about/Why don’t)."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Information-gap role-play; re-pairing"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7 – Speak: Divide the class into A and B. Students read their information, work with someone from the same group to think of things to say/ask, then re-pair (one A with one B) for the role-play. One or two pairs share the advice received; elicit corrections; highlight effective advice/suggestion language."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "To check verb forms, give a problem (e.g. you have a headache) and ask students to give advice using a different phrase from the explore grammar box each time (You should see a doctor. / You ought to take a tablet. / Why don’t you lie down?). Digital classroom: students share a problem online and reply with advice; vote for the best advice."], ["h2", "Remedial", "#D63A72"], ["p", "students practise reading the Ex 6 conversation aloud in A/B pairs, then use prompts (A: tablet / buy? B: something older…) to say it with closed books."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Hands-up survey; class feedback"], ["h2", "Activity 2", "#D63A72"], ["p", "Students record answers; peer comparison next"], ["h2", "Activity 3", "#D63A72"], ["p", "Pairs justify answers; class feedback"], ["h2", "Activity 4", "#D63A72"], ["p", "Class check of the answer"], ["h2", "Activity 5", "#D63A72"], ["p", "Pair checking; class feedback"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – Speak (Ex 7); peer learning"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Students think of a problem (real or made up) and move around the class, talking to at least three people – each shares the problem and gives advice. In pairs, they tell each other their problem and the best advice they got; one or two pairs share with the class."], ["h2", "Reflect on learning", "#E5504D"], ["p", "On a scale of 1–5, how confident do you feel about the multiple choice (pictures) task? How can you improve?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p32 (Exs 1–6: purposes of technology, predicting words, W3.03 listening, advice gap-fill, W3.04, own sentences)."], ["li", "Grammar file SB pp56–57 (Exs 5–7)."], ["li", "Practice Guide p77 (multiple choice – pictures)."]]}]}, {"n": "Lesson 5 – Speaking", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "THE FUTURE IS NOW"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 5 – Speaking"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "listen to a collaborative task and identify how speakers give opinions, agree and disagree;"], ["li", "use a range of phrases to give and ask for opinions and to agree and disagree politely;"], ["li", "complete a collaborative task and reach an agreement;"], ["li", "discuss technology topics and give reasons for their views."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "giving opinions (In my opinion, In my view, For me, I think, I’d say)"], ["li", "asking for opinions (What’s your view on…?)"], ["li", "agreeing (That’s a good point, You’re right, That’s true)"], ["li", "disagreeing (I disagree, That’s true but…, I’m not sure)."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Students close their eyes or look down and visualise a robot: What does it look like? How big is it? What colour is it? What does it do? What sounds does it make? Students answer silently. In pairs they describe their robots; one or two pairs say how similar or different they were."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Visual prompts; pair discussion; predicting"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Focus attention on the photo and elicit what students can see. Pairs discuss the questions (the technology they would like a robot to do; what AI can do better than humans). Class feedback."], ["h2", "Time", "#C25E00"], ["p", "3 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p43"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening to a model; understanding the task; noticing language"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2 (3.03): Explain the task (a situation with pictures; discuss and suggest an answer in pairs, then discuss related questions). Students hear two candidates; play the recording; check answers (AI household assistant, AI doctor, AI clothes assistant; they agree the clothes assistant is most useful)."], ["p", "Ex 3 (3.03): Students guess the missing words in the extracts, then listen to check."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 3.03; SB Ex 2–3; PG p87 (walkthrough p86) and p89 (walkthrough p88)"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Categorising language functions; useful language box"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4: Ask where In my opinion would go in the useful language box (giving opinions); students put the other phrases in the correct groups. Highlight that when we disagree, we often say something positive and then give the opposite view using but. Explain that using a variety of phrases helps score well in Interactive communication and Grammar and Vocabulary."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 4, useful language box"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Study tip; self-selected target language; collaborative task"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5: Read the study tip; students choose at least three phrases they don’t normally use."], ["p", "Ex 6 – Speak (practice task): Read the instructions. Students discuss as many options as possible and try to reach an agreement, using their chosen phrases. Pairs report which AI assistant they chose and why. Give feedback; elicit corrections."], ["h2", "Time", "#C25E00"], ["p", "9 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5–6; PG p87"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Discussion questions; giving reasons; teacher feedback"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7: Give time to read the questions and think of things to say. Pairs discuss. Give feedback on performance, highlighting strengths and how to impr const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function blocksToHTML(blocks){
  let h="",list=false;
  const close=()=>{if(list){h+="</ul>";list=false}};
  for(const [k,x,c] of blocks){
    const s=esc(x);
    if(k==="li"){
      if(!list){h+='<ul style="margin:0 0 8px 0;padding-left:22px">';list=true}
      h+='<li data-b style="font-size:15px;line-height:1.55;margin:0 0 4px">'+s+'</li>';continue;
    }
    close();
    if(k==="h1")h+='<h3 data-h style="font-size:20px;font-weight:800;line-height:1.3;margin:18px 0 4px;color:'+c+'">'+s+'</h3>';
    else if(k==="h2")h+='<h4 data-h style="font-size:16px;font-weight:700;line-height:1.3;margin:12px 0 2px;color:'+c+'">'+s+'</h4>';
    else h+='<p data-b style="font-size:15px;line-height:1.55;margin:0 0 8px">'+s+'</p>';
  }
  close();return h;
}
async function copyRich(box){
  const clone=box.cloneNode(true);
  clone.querySelectorAll("[data-b]").forEach(e=>{e.style.color="#222222"});
  const html='<div style="font-family:Calibri,Arial,sans-serif;color:#222222">'+clone.innerHTML+'</div>';
  const text=box.innerText;
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]);
      return true;
    }
  }catch(e){}
  const tmp=document.createElement("div");
  tmp.contentEditable="true";
  tmp.style.cssText="position:fixed;left:-9999px;top:0;background:#fff;color:#222";
  tmp.innerHTML=html;document.body.append(tmp);
  const r=document.createRange();r.selectNodeContents(tmp);
  const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}
  sel.removeAllRanges();tmp.remove();return ok;
}
function render(L){
  out.innerHTML="";
  const t=document.createElement("h2");t.className="lt";t.textContent=L.n;out.append(t);
  L.s.forEach(s=>{
    const c=document.createElement("section");c.className="card";c.style.setProperty("--c",s.c);
    c.innerHTML='<div class="head"><div class="ico" aria-hidden="true">'+s.i+'</div><h3></h3></div><div class="box"><div class="rt" contenteditable="true" role="textbox" aria-multiline="true"></div><span class="tip" role="status">Copied!</span><button class="copy" type="button" title="Copy text with formatting" aria-label="Copy with formatting">'+ICON_CP+ICON_OK+'</button></div>';
    c.querySelector("h3").textContent=s.t;
    const box=c.querySelector(".rt");box.innerHTML=blocksToHTML(s.b);box.setAttribute("aria-label",s.t);
    const b=c.querySelector(".copy"),tip=c.querySelector(".tip");
    b.onclick=async()=>{
      const ok=await copyRich(box);
      tip.textContent=ok?"Copied!":"Copy failed";tip.style.background=ok?"#1E9E63":"#D33";
      if(ok)b.classList.add("done");tip.classList.add("on");
      setTimeout(()=>{b.classList.remove("done");tip.classList.remove("on")},1600)};
    out.append(c);
  });
}
</script>
</body>
</html>
