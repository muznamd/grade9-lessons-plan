<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 9 Lesson Plan Sections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7FF;--card:#fff;--text:#1E2440;--muted:#5B6488;--border:#DDE4F5;--accent:#2F6FED;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141830;--card:#1F2545;--text:#EEF1FF;--muted:#A9B2DC;--border:#333B6B}}
:root[data-theme="dark"]{--bg:#141830;--card:#1F2545;--text:#EEF1FF;--muted:#A9B2DC;--border:#333B6B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
header{background:var(--accent);color:#fff;padding:22px 16px 18px;transition:background .3s}
.wrap{max-width:820px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.7rem;font-weight:800;line-height:1.2}
header p{margin:0;opacity:.92}
.pick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);padding:0 16px 16px;transition:background .3s}
.pick .wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:800;color:#fff;margin-bottom:4px;font-size:.95rem}
select{width:100%;font:inherit;font-weight:700;color:var(--text);background:var(--card);border:3px solid transparent;border-radius:14px;padding:12px 14px;appearance:auto;cursor:pointer}
select:disabled{opacity:.6;cursor:not-allowed}
select:focus-visible,.rt:focus-visible,.copy:focus-visible{outline:3px solid #FFD43B;outline-offset:2px}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.empty{text-align:center;background:var(--card);border:2px dashed var(--border);border-radius:20px;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:3rem;line-height:1}
.empty h2{margin:10px 0 4px;color:var(--text);font-size:1.3rem}
.lt{margin:0 0 16px;font-size:1.35rem;font-weight:800}
.sub{margin:26px 0 12px;font-size:1.15rem;font-weight:800;color:var(--muted)}
.card{--c:#2F6FED;background:var(--card);border:1px solid var(--border);border-left:8px solid var(--c);border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:14px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:color-mix(in srgb,var(--c) 18%,var(--card))}
.head h3{margin:0;font-size:1.1rem;font-weight:800;color:var(--c);flex:1}
:root[data-theme="dark"] .head h3{filter:brightness(1.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .head h3{filter:brightness(1.35)}}
.chip{background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--text);font-weight:700;font-size:.85rem;border-radius:999px;padding:3px 10px}
.box{position:relative}
.rt{display:block;width:100%;min-height:64px;color:var(--text);background:color-mix(in srgb,var(--c) 8%,var(--card));border:2px solid color-mix(in srgb,var(--c) 40%,var(--card));border-radius:12px;padding:12px 56px 12px 14px;font-family:inherit;overflow-wrap:anywhere}
.rt>:first-child{margin-top:0!important}
.rt>:last-child{margin-bottom:0!important}
.rt [data-b]{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rt [data-h]{filter:brightness(1.55)}}
:root[data-theme="dark"] .rt [data-h]{filter:brightness(1.55)}
.copy{position:absolute;top:8px;right:8px;width:38px;height:38px;border:0;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .2s}
.copy:hover{transform:scale(1.08)}
.copy:active{transform:scale(.94)}
.copy svg{width:20px;height:20px}
.copy .ok{display:none}
.copy.done{background:#1E9E63}
.copy.done .cp{display:none}.copy.done .ok{display:block}
.tip{position:absolute;top:14px;right:54px;background:#1E9E63;color:#fff;font-weight:800;font-size:.8rem;padding:3px 9px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s}
.tip.on{opacity:1}
@media (max-width:480px){.pick .wrap{grid-template-columns:1fr}h1{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Grade 9 Lesson Plan Sections</h1><p>Choose a unit and a lesson, then copy any section with one tap.</p></div></header>
<div class="pick"><div class="wrap">
<div><label for="unit">Unit</label><select id="unit"></select></div>
<div><label for="lesson">Lesson</label><select id="lesson" disabled></select></div>
</div></div>
<main id="out"></main>
<script>
const DATA=[{"n": "Identity", "l": [{"n": "Lesson 1 – Reading", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "IDENTITY"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 1 – Reading"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "scan short profiles to find people’s hobbies and specific information;"], ["li", "match six profiles to photo-board descriptions by finding matching key words (multiple matching);"], ["li", "work out the meaning of new words from context (valley, cover, busy, background, stadium);"], ["li", "summarise a profile and explain what they would put on their own photo board and why."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "vocabulary of identity and interests – valley, cover, busy, background, stadium"], ["li", "describing where you live, your hobbies and your family (I live…, I love…, I’m having karate lessons at the moment)."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board and explain what students will do. Write Identity – who are you? on the board and model it: tell the class who you are (e.g. I’m a father, a brother, an F1 fan, a chocolate lover…). In pairs, students come up with as many things as they can in two minutes that describe who they are. Class feedback: what did pairs have in common?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Visual prompts; predicting; whole-class checking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Focus on the photos. Students read the description and answer Qs 1–3 (what a photo board is, what the person might be like, what the photos show). Check as a class."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Student’s Book (SB) pp13–15"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Skimming and scanning with a time limit; eliciting key words"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2: Tell students they will read six profiles quickly for general understanding first. Time limit: 3 minutes to find each person’s hobbies. Check answers and elicit the key words in each profile (audio version available)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB profiles (Osama, Hana, Basil, Kim, Riley, Cody); audio"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guided modelling; matching and justifying; pair checking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 (practice task): Elicit what students know about Osama. They read the study tip and do the first task (choose the correct information). Explain that some of Osama’s information matches several boards but only one matches all of it (board D). Feedback: students justify."], ["p", "Ex 4: Students match profiles 2–6 to the photo-board descriptions, checking that all the information matches. Pairs check and justify; class feedback."], ["h2", "Time", "#C25E00"], ["p", "12 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3–4; Practice Guide (PG) p65 (task walkthrough on p64)"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guessing meaning from context; concept-checking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5: In pairs, read the definitions and guess the words, then read the profiles and descriptions to find them. Concept-check: Is a valley flat or hilly? What do you usually find on a book cover? What places in your city get busy? What’s the opposite of background? What else happens at a stadium?"], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5; board"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Summarising from memory (closed books); peer agreement"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6 – Sum up: Closed books. Write the six names on the board and highlight the examples. Pairs summarise each person; choose a student to summarise each in open class and ask the others if they agree."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Board"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Teacher modelling; planning time; group work"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7 – Speak: Model what you would put on your photo board and why. Give planning time, then students share in small groups. Groups report interesting items to the class. Deal with common errors heard while monitoring. Read the Fun footer and ask if students agree."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7; Fun footer"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "Fast finishers write a profile for one of the remaining photo-board descriptions that does not match a profile (in pairs if possible)."], ["h2", "Digital classroom extra", "#C25E00"], ["p", "watch an online “identity box” video, note what is in it and why, then create their own digital box."], ["h2", "Remedial (mixed ability)", "#D63A72"], ["p", "Write the paragraph letter for each Ex 5 word on paper (1–A, 2–A, 3–C, 4–H, 5–I) and pin it on the wall for students who need support."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Class feedback on answers to Qs 1–3"], ["h2", "Activity 2", "#D63A72"], ["p", "Check answers; elicit key words"], ["h2", "Activity 3", "#D63A72"], ["p", "Pair checking; students justify answers with key words"], ["h2", "Activity 4", "#D63A72"], ["p", "Class feedback; concept-checking questions"], ["h2", "Activity 5", "#D63A72"], ["p", "Peers agree/disagree with each summary"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitor groups; note common errors"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Students create a photo board for their class or school: in groups they decide ten things that represent the class, then the whole class agrees the top five."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What was the most interesting thing you learnt this lesson? What else would you like to find out? Pairs discuss; share."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook pp12–13 (Exs 1–5: vocabulary gap-fill, reading five short texts, matching students to clubs, phrasal verbs)."], ["li", "Practice Guide p65 (multiple matching)."]]}]}, {"n": "Lesson 2 – Grammar", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "IDENTITY"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 2 – Grammar"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "use the present simple for habits/repeated actions and the present continuous for actions happening now;"], ["li", "identify the tense in a recording or text and explain why it is used;"], ["li", "understand verbs that can describe both states and actions (think, feel, see, have);"], ["li", "talk about their routines and what they are doing at the moment."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "present simple (habits, repeated actions) and present continuous (actions happening now/around now)"], ["li", "state and action verbs (think, feel, see, have)"], ["li", "e.g. I help my parents every day. I’m working on a project at the moment."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Write these questions: What are some things you do every day outside school? What is something you eat almost every day? What projects are you working on at the moment? What are you looking forward to at the moment? Pairs discuss. Monitor and assess use of the present tenses and any issues of use, form or pronunciation. A few students share what they learnt about their partner."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Recalling previous learning; pair discussion"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Remind students of the photo boards from Lesson 1. Pairs discuss the questions (what the people like doing; what Osama is doing at the moment). Elicit answers."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p16"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive grammar; eliciting rules; checking with a reference box"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2 – Explore grammar: Write an example of each tense (I help my parents clean the kitchen every day. I’m working on a history project at the moment.). Underline the verbs; elicit the two tenses and why they are used. Students read the explore grammar box (SB p52) and say which sentences are true for them."], ["p", "Watch out for: read out the four pairs of sentences (think, feel, see, have); students hold thumbs up for action and thumbs down for state."], ["h2", "Time", "#C25E00"], ["p", "9 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p16; Grammar file SB p52; Grammar presentation slides Unit 1"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening for gist and detail (video/audio)"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 (1.01): Students read the questions first and count the number of answers to each question. Play the video (or the recording) once. Class feedback."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio/video 1.01"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Predicting; listening and completing; explaining language use"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4 (1.01): Students predict the missing verbs, then listen and complete the eight sentences (play twice if needed). Class feedback: why is each tense used (habit/repeated action, or action happening around now)?"], ["p", "Extra: note at least six activities not mentioned in Ex 4; compare the teenagers with themselves."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 1.01; SB Ex 4"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Contextualised practice; pair justification"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5: Ask what kind of text it is (an online conversation), who the people are and what they talk about. Students complete the gaps, then compare and justify their verb choices in pairs. Class feedback."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Modelling; personalised speaking; error correction"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6 – Speak: Model the activity or use the example. Give thinking time; pairs share information about routines and what they are doing now. Monitor and assess use of the present tenses. A few students share the most interesting thing they learnt. Deal with common errors."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "Fast finishers read the conversation in Ex 5 for two minutes, then close books and perform it orally as if on a video call."], ["h2", "Remedial", "#D63A72"], ["p", "Students rate their use of the present tenses (1 = needs work, 5 = very good); walk around to gauge confidence and direct lower-ability or less confident students to Grammar file practice Exs 1–5 on SB p53."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Elicit answers from the class"], ["h2", "Activity 2", "#D63A72"], ["p", "Thumbs up/down check; students’ own true sentences"], ["h2", "Activity 3", "#D63A72"], ["p", "Class feedback on the count"], ["h2", "Activity 4", "#D63A72"], ["p", "Class feedback – justify the tense"], ["h2", "Activity 5", "#D63A72"], ["p", "Pairs justify choices; class feedback"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitor and assess (Speak, Ex 6)"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Students answer the questions in Ex 3 using appropriate tenses; monitor and correct on the spot. One or two students share what they learnt about their partner."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What new things did you learn about present tenses? How will you use them in the future? Pairs discuss; share."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p14 (Exs 1–5: present simple/continuous gap-fill, questions, listening W1.01, Giacomo text)."], ["li", "Grammar file SB pp52–53 (Exs 1–5) for extra practice."], ["li", "Photocopiable 1A."]]}]}, {"n": "Lesson 3 – Vocabulary", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "IDENTITY"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 3 – Vocabulary"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "understand and use personality adjectives to describe people;"], ["li", "use adjective + preposition collocations correctly, followed by a noun or an -ing form;"], ["li", "complete a multiple-choice cloze practice task;"], ["li", "describe family members using the vocabulary of the lesson."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "unpleasant, lazy, sociable, noisy, rude, funny, clever, confident, sporty, serious, shy, calm"], ["li", "ambitious, generous, easy-going"], ["li", "good at, bored with, excited about, interested in, afraid of, keen on."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. On paper, write five personality adjectives the class probably knows (e.g. creative, friendly, honest, polite, smart). In teams, students guess the adjectives from the first letter of each, written on the board. A team puts up its hand when finished; check their answers and say which are correct. Continue until a team guesses all five."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Defining and guessing meaning; dictionary use; pronunciation drilling"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: In pairs, students cover the definitions and discuss what the 12 words mean, then uncover the definitions to complete the task. Encourage use of a dictionary. Class feedback. Drill pronunciation, focusing on sociable and calm."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p17; dictionary (e.g. Longman)"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Classifying; critical thinking; pair comparison"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2: Students answer alone, then compare with a partner and find out how others organised the adjectives (positive, negative, neutral)."], ["p", "Critical thinking: write on the board My brother’s ambitious… / My sister’s generous… / My uncle’s easy-going…; check meanings, drill pronunciation; pairs decide if each adjective is positive, negative or both."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 2; board"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Reading for gist; listening to check; noticing intonation"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3: Students read the conversation quickly (who are the people? what are they talking about?), choose the correct words and compare in pairs (do not check yet)."], ["p", "Ex 4 (1.02): Play the recording to check. Play again: How does Speaker B feel (annoyed)? How do we know (words and intonation)?"], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3–4; Audio 1.02"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive language work; noticing pronunciation"], ["h2", "Activity", "#2F6FED"], ["p", "Explore language: write good, bored, excited, interesting, afraid, keen on on the board; students guess the prepositions, then read the explore language box. Write I’m interested in … and complete with a noun and an -ing activity. Highlight linking (good at) and weak forms /ət/, /əv/."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p17 explore language box; board"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Predicting; skimming; exam-task strategies; pair justification"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5 (practice task – multiple-choice cloze): Pairs read the blog title and predict content, then read quickly to check. Demonstrate gap 1 and ask why. Students complete the task, compare and justify; class feedback establishing why each answer is correct."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5; PG p71 (walkthrough p70)"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Asking and answering; peer interview; monitoring"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6 – Speak: Pairs think of a yes/no question for each adjective + preposition in the language box (e.g. Are you good at cooking?). Check the -ing form. Two pairs interview each other and share interesting answers. Deal with errors."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment / mixed ability", "#7B5CE6"], ["p", "Higher-ability students cover the adjectives in Ex 1 and try to complete the definitions first, then compare."], ["h2", "Remedial", "#D63A72"], ["p", "Give lower-ability classes time to prepare what to say in “To finish”; students needing more help can use Practice Guide p71 for the task explanation."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Class feedback; pronunciation check"], ["h2", "Activity 2", "#D63A72"], ["p", "Class feedback; students justify their groupings"], ["h2", "Activity 3", "#D63A72"], ["p", "Pairs compare; answers checked by listening"], ["h2", "Activity 4", "#D63A72"], ["p", "Students complete I’m interested in … correctly"], ["h2", "Activity 5", "#D63A72"], ["p", "Monitoring – practice task (PG p71)"], ["h2", "Activity 6", "#D63A72"], ["p", "Peer learning – pair work; note errors"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Students describe people in their family using the lesson vocabulary (e.g. My brother’s quite bossy. I get fed up with him…). Pairs describe their families; monitor vocabulary use; find out if families have anything in common; deal with common errors."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What new adjectives did you learn today? How will you record them?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p15 (Exs 1–5: matching adjectives to pictures, sentence halves, adjective gap-fill, prepositions, writing sentences)."], ["li", "Practice Guide p71 (multiple-choice cloze)."], ["li", "Photocopiable 1B."]]}]}, {"n": "Lesson 4 – Listening", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "IDENTITY"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 4 – Listening"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "identify whether a question asks about agreement, a suggestion or feelings;"], ["li", "listen to conversations about cities and choose the correct answer (multiple choice);"], ["li", "use adverbs of frequency and time phrases in the correct position;"], ["li", "ask and answer questions about habits and routines."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "adverbs of frequency (always, usually, often, hardly ever, rarely) and time phrases (once a month, every day, now and then, most days)"], ["li", "feelings adjectives (excited, happy, interested, pleased, relaxed, stressed)."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Give two choices (e.g. cats/pet birds, tea/coffee, watching sport/doing sport). Students stand on the left for the first choice and on the right for the second (or turn left/right if there is no space) and discuss their reasons with a partner for one minute. Continue until you end with city/country to introduce the topic."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Eliciting; personalised discussion"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1–2: Elicit which feelings adjectives are positive (excited, happy, interested, pleased, relaxed) and which is negative (stressed); check stressed. Students think about the question, compare in pairs and one or two pairs share what they learnt."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p18"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Identifying key words; exam-task strategy"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 (practice task): Students read the study tip and identify what to listen for in Q1 – agreement, a suggestion or feelings – and its key words. They do the same alone for Qs 2–6. Class feedback."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3; PG p79 (walkthrough p78)"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Modelled listening; pair checking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4 (1.03): Play the first conversation; students choose the correct option and check in pairs. Check with the class."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 1.03"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening for gist and detail; justifying answers"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5–6 (1.04): Students read the options in Qs 2–6 and recall their key words. Play the recording; do not check yet. Play a second time so they can check; pairs discuss and justify answers. Replay part of the recording for tricky questions."], ["h2", "Time", "#C25E00"], ["p", "9 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 1.04; SB Ex 5–6"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive grammar; controlled then freer practice"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7 – Explore grammar: write I hate autumn – it’s always so windy and My brother usually stays up late at weekends; students identify the adverbs and their purpose, read the explore grammar box (SB p52) and change two sentences to be true for them."], ["p", "Ex 8–9: put words in order (position of adverbs/time phrases); write sentences about themselves; monitor and elicit corrections."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7–9; Grammar file SB p52"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Modelling; information gap; assessing use of language"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 10 – Speak: Demonstrate with a confident student, asking follow-up questions to find what you have in common. Pairs ask and answer about habits and routines. In open class, ask if they were similar to their partner. Deal with common errors."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 10"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "Write extra sentences on the board and ask students to place the adverb in brackets: I ride a bike (hardly ever); They take the bus to school (on Mondays); The streets are busy (often)."], ["h2", "Remedial (mixed ability)", "#D63A72"], ["p", "Brainstorm follow-up questions with the class and note them on the board for lower-ability students to use in Ex 10 (e.g. Where do you hang out? What do you do there? Why do you use it so much?)."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Pairs share; class feedback"], ["h2", "Activity 2", "#D63A72"], ["p", "Class feedback on A / S / F and key words"], ["h2", "Activity 3", "#D63A72"], ["p", "Pair check; class check of Q1"], ["h2", "Activity 4", "#D63A72"], ["p", "Pairs justify; class feedback"], ["h2", "Activity 5", "#D63A72"], ["p", "Monitor and correct adverb position"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – Speak (Ex 10)"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Class survey: each student writes a prediction about the class using an adverb of frequency or time phrase (e.g. People in the class usually have dinner at 7 p.m.), interviews classmates to check it, then reports findings to the class or group."], ["h2", "Reflect on learning", "#E5504D"], ["p", "On a scale of 1–5, how confident do you feel about the multiple-choice task? How can you improve?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p16 (Exs 1–6: key words and question types in listening, W1.02, frequency expressions, sentence completion)."], ["li", "Grammar file SB pp52–53."], ["li", "Practice Guide p79 (multiple choice)."]]}]}, {"n": "Lesson 5 – Speaking", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "IDENTITY"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 5 – Speaking"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "ask and answer questions to give personal information;"], ["li", "listen to two answers and decide which is better and why;"], ["li", "extend answers with reasons and examples using useful language;"], ["li", "complete the introduction practice task with a partner."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "questions for personal details (full name, surname, middle name, address, postcode)"], ["li", "What do you enjoy doing in your free time?"], ["li", "reasons and examples – as, because, one reason is (that), for example."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Write your own answers to three or four of these questions on the board: What do you enjoy doing in your free time? How do you get to school every day? What do you usually do at the weekend? What did you do last weekend? How often do you watch TV? In pairs students guess the questions; class feedback. Explain that this lesson focuses on questions like these."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Checking vocabulary; personalised pair work; cultural awareness"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Check the difference between full name and surname (and middle name). Students think of answers and do the task in pairs; elicit answers (volunteers only for middle names). Explain naming systems in English-speaking countries and elsewhere."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p19"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Eliciting questions; information exchange"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2: Elicit the questions needed before students complete the table in pairs (note: a postcode is a zip code in the USA). Pairs show each other their tables to check."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 2 (table)"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening and evaluating"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 (1.05): Students hear two students (Huda and Chen) answer questions; one answers better. Play the recording; pairs discuss, then class feedback (Chen’s answers are fuller and more descriptive)."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 1.05"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Noticing useful language; improving a model answer"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4: Students find in the useful language box which words introduce a reason (as, because, one reason is (that)) and which an example (for example). Pairs try to improve Huda’s answer using these; replay her answer if needed. Elicit ideas."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB useful language box"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Comparing answers; extending responses"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5 (1.06): Play the recording so students can assess the answers; pairs compare, then class feedback (Huda’s is best)."], ["p", "Ex 6: Pairs plan how Chen could extend his answer with the useful language; replay his answer; elicit ideas."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 1.06; SB Ex 5–6"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Rehearsal and recording; peer learning"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7 (practice task): Give time to think how to answer and extend with reasons and examples; record themselves if possible. Pairs ask and answer. Feedback on the ability to extend answers; deal with common errors."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7; PG p83 (walkthrough p82)"], ["h1", "Activity 7", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Role-play; working with a new partner"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 8: Model the Fact File – students ask you questions and you answer as a famous person, extending each answer. Pairs repeat (facts may be researched or invented)."], ["p", "Ex 9 – Speaking extra: new partners ask and answer the questions; report to the class; note errors and good language (or use the additional task, SB p83)."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 8–9 (pp58–60); Fun footer"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment (fast finishers)", "#7B5CE6"], ["p", "answer additional questions – Where do you enjoy spending time? Why? Do you prefer mornings or evenings? Why?"], ["h2", "Remedial (mixed ability)", "#D63A72"], ["p", "put prompts on the board for lower-ability students to extend answers, e.g. I get to school by … because … I usually … / It’s … because … For example, … / One of the reasons why I like it is that … Additional Speaking practice task available on SB p83."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Elicit answers from around the class"], ["h2", "Activity 2", "#D63A72"], ["p", "Peer checking of tables"], ["h2", "Activity 3", "#D63A72"], ["p", "Pair discussion; class feedback"], ["h2", "Activity 4", "#D63A72"], ["p", "Elicit improved answers"], ["h2", "Activity 5", "#D63A72"], ["p", "Pairs compare; class feedback"], ["h2", "Activity 6", "#D63A72"], ["p", "Peer learning – pair work; teacher feedback"], ["h2", "Activity 7", "#D63A72"], ["p", "Monitoring – Speak (Ex 9)"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Reasons game: groups of up to six. Write a statement (e.g. Pizza is the tastiest food in the world). Each student in turn gives a different reason (One reason is that… / Also, … / On top of that, …); a student who cannot think of one is out; the last student wins."], ["h2", "Reflect on learning", "#E5504D"], ["p", "On a scale of 1–5, how confident do you feel about the introductions task? How can you practise further? (5 min) Tell students they will write an email next lesson."]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p17 (Exs 1–7: ordering questions, W1.03 form completion, W1.04 membership form, matching questions, reasons and examples, interview gap-fill, W1.05)."], ["li", "Practice Guide p83 (introduction)."], ["li", "Photocopiable 1C."]]}]}, {"n": "Lesson 6 – Writing", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "IDENTITY"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 6 – Writing"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "read a model email and match each paragraph to the notes in an advertisement;"], ["li", "use quite and very to modify adjectives and join ideas with and, because, but, or, so;"], ["li", "plan and write an email introducing themselves (where I live, my personality, what I enjoy, why choose me);"], ["li", "give and use peer feedback to improve their writing."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "quite/very + adjective (quite pretty, very friendly, very hard-working)"], ["li", "linkers and, because, but, or, so"], ["li", "I’m keen on…, I’m interested in…, I can’t stand…."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Write these prompts: I really enjoy watching … on TV/online because … / Something I hate watching on TV or online is … because … Give thinking time; pairs share ideas. Elicit ideas from the class to find out if many students watch the same thing and why."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Teacher modelling; asking questions; pair speaking"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Demonstrate by telling students about one of the things in the prompts and encourage them to ask you questions. Students think of an idea for each prompt (things they love, are interested in, are keen on, can’t stand), then do the task in pairs. One or two students share what they learnt."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB pp20–21"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Reading for gist and text organisation"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2 – Read: Students read the Channel 1 advertisement (teenagers’ lives for a documentary) and the four handwritten notes A–D. They read Rahaf’s email and match each paragraph to the notes (P1 = A, P2 = B, P3 = C, P4 = D). Class feedback."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 2 (advertisement, model email)"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Noticing language; controlled practice; linking ideas"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 – Explore language: students underline quite and very in Rahaf’s email, say how they change the adjective, then read the explore language box. Board check: I’m a hard-working student (I’m a very hard-working student / I’m quite a hard-working student)."], ["p", "Ex 4: choose the correct option in Filip’s notes. Ex 5: on the board write and, because, but, or, so; elicit their uses and join sentences."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3–5; board"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Planning before writing; study tip; pair explanation"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6 – Plan and write: students plan (tasks 1 and 2), writing notes rather than full sentences, then explain to a partner what they will write (task 3)."], ["p", "Ex 7: read the study tip, then improve their plan. Highlight the four writing descriptors (Content, Communicative achievement, Organisation, Language) – this tip helps with Content (see pp110–112)."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6–7; PG p73 (walkthrough p72); TB pp110–112"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guided writing; monitoring and elicited correction"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 8: Set the writing task (in class or for homework). If in class, monitor and help students improve their writing by offering suggestions or eliciting corrections; point out what they are doing right. Model: SB p20."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 8; lined paper/notebooks"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Peer feedback; reflection on the writing process"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 9 – Improve it: give feedback prompts (I liked the way you… / Maybe next time you could…). Students give constructive feedback in pairs. Ask what they found easy and difficult and suggest strategies. Collect emails to mark with feedback on strengths and areas to work on."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 9; Fun footer"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "Critical thinking – pairs brainstorm advantages and disadvantages of appearing on a reality TV show, discuss whether they would like to be on the show in the advertisement and why/why not; quick class poll. Game: pairs write at least six adjectives and prepositions from the unit and test a new partner."], ["h2", "Remedial (mixed ability)", "#D63A72"], ["p", "put prompts on the board for questions (What do you…? Why do/don’t you…? Who do you … with? When do you…? Where do you…?). Lower-ability writers write fewer words (e.g. 70) but include all four notes."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Peer learning – pair work; class sharing"], ["h2", "Activity 2", "#D63A72"], ["p", "Class feedback on paragraph matching"], ["h2", "Activity 3", "#D63A72"], ["p", "Class feedback; students say why other options are not possible"], ["h2", "Activity 4", "#D63A72"], ["p", "Peer learning – pairs explain their plan"], ["h2", "Activity 5", "#D63A72"], ["p", "Monitoring – teacher feedback while writing"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – Improve it (Ex 9); peer feedback"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Role-play: Group A = Channel 1 production team, Group B = teenagers who want to be on the reality show. Group A prepares questions; group B thinks of possible answers. Pair A and B students for the interview; the production team decides whether to accept them and gives reasons."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What new vocabulary did you learn? What other types of emails will you write in English?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Finish the email (Ex 8) if not completed in class."], ["li", "Workbook p18 (Exs 1–6: identify sentence types, prepositions, quite/very, reading an advert, model email, writing an email for school council)."], ["li", "Practice Guide p73 (writing an email)."], ["li", "Photocopiable 1D."]]}]}, {"n": "Lesson 7 – Switch On", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "IDENTITY"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 7 – Switch On"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "discuss ideas about learning and evening classes;"], ["li", "watch a video to get the gist and find key details;"], ["li", "complete a summary and verb + noun collocations from the video;"], ["li", "work in a group to prepare and present an information sheet about evening classes."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "evening classes and lifelong-learning vocabulary"], ["li", "verb + noun collocations (arrange flowers, repair a car, take a class, join a class, make friends, give confidence)."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Preview (Ex 1–2): Share the lesson aims. Put students in pairs to discuss the Preview questions; then join pairs into groups to compare their ideas. In feedback, ask for answers around the class and see if they agree; if not, encourage them to justify their opinions."], ["h2", "Time", "#C25E00"], ["p", "8 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Describing a picture; gist viewing; comparing predictions"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 – View: Students describe the picture, then read the question. Play the video; students answer and compare with their ideas from Ex 1. Find out who had the same ideas. (Answer: You can learn to do things at any age and anywhere.)"], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p22; Video Unit 1"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Reading before viewing; listening for detail; pausing the video"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4: Give time to read the summary; students try to write answers now. Play the video again so they complete (or check) the ten gaps. Play more than once if needed, pausing after each key piece of information. Check with the class."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Video Unit 1; SB Ex 4"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Learning collocations; verb-tense accuracy; checking by re-viewing"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5: Read the first sentence and elicit the answer; point out that it is useful to learn collocations (which verbs go with which nouns, e.g. arrange flowers). Pairs complete the task using the correct present or past simple form. Play the video again to check in context."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Video Unit 1; SB Ex 5"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Discussion; giving reasons and opinions"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6 – Speak: Pairs discuss the questions (how evening classes differ from school; benefits of learning practical things and new skills; students’ own views). A few pairs share ideas with the class and find out if others agree."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Project-based learning; collaboration; peer questioning"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7 – Project: In small groups, read the steps together and check students know what to do. Step 1: list the evening classes in the video and what people do or make in each. Step 4: decide who presents what. Monitor, help with vocabulary and write new words on the board. Groups compare information sheets; other groups think of questions and ask the group that made the sheet."], ["h2", "Time", "#C25E00"], ["p", "9 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7; paper/poster materials; board"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment – Extended project", "#7B5CE6"], ["p", "students give a presentation about real evening classes: research the local area (or a larger nearby city) – what people can do and learn, lesson times, age restrictions, length, other useful information; choose a learning centre to present; find suitable photos; each group presents and others ask questions; decide which centre’s classes they like best and why."], ["h2", "Remedial", "#D63A72"], ["p", "pause and replay the video after each key piece of information; write new words/phrases on the board during the project."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Compare with Ex 1 answers; class check"], ["h2", "Activity 2", "#D63A72"], ["p", "Class check of the ten answers"], ["h2", "Activity 3", "#D63A72"], ["p", "Pairs check; video used to confirm answers"], ["h2", "Activity 4", "#D63A72"], ["p", "Peer learning – group/pair work; class sharing"], ["h2", "Activity 5", "#D63A72"], ["p", "Monitoring – Project (Ex 7); questions from other groups"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Class vote on the most interesting evening class. Open it up into a class discussion so students give their reasons. Explain the Extended project (see Homework)."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Extended project research: find out about evening classes in the local area or a larger city nearby – what people can do and learn at each centre, the times of lessons, any age restrictions, how long they are and other useful information."], ["li", "Bring notes and pictures for the next lesson."]]}]}, {"n": "Lesson 8 – Unit check", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "IDENTITY"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 8 – Unit check"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "review the language and grammar of Unit 1 (Identity);"], ["li", "choose and complete the correct present simple/continuous forms and order sentences with adverbs of frequency and time phrases;"], ["li", "use adjective + preposition collocations and check answers by listening (1.07, 1.08);"], ["li", "write a short paragraph (about 40–50 words) about what they do in their free time."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "present simple and present continuous"], ["li", "adverbs of frequency and time phrases"], ["li", "personality adjectives"], ["li", "adjective + preposition collocations (keen on, terrible at, excited about, brilliant at…)."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Ask students to tell you three things they do every week and one thing they are doing now. Demonstrate by talking about yourself first (e.g. Every week, I play tennis on Saturdays, visit my grandparents and go to work by bus. Today, I am helping you to revise the present simple and continuous!). Praise all good answers."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Revision; independent work then class feedback"], ["h2", "Activity", "#2F6FED"], ["p", "Review Exs 1–4: Students choose the correct words / order the sentences / complete sentences with present simple or present continuous forms, and adverbs of frequency and time phrases. Check answers with the class."], ["h2", "Time", "#C25E00"], ["p", "9 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB pp23–24 Review; Grammar file SB pp50–53"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guided review; using the wordlist"], ["h2", "Activity", "#2F6FED"], ["p", "Practice Ex 1–2: Read the gapped sentences with the class; students choose the correct words (multiple choice). Then read the message with the class; students complete it with the correct prepositions, using the wordlist if needed."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Practice Ex 1–2; wordlist"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Listening to check answers; explaining choices"], ["h2", "Activity", "#2F6FED"], ["p", "Practice Ex 3 (1.07): students complete sentences with the correct adjective + preposition (excited about, keen on, terrible at, bad at, brilliant at…), then listen and check."], ["p", "Practice Ex 4 (1.08): students choose the correct sentence in each pair and listen to check; justify (e.g. present continuous – happening now)."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Practice Ex 3–4; Audio 1.07, 1.08"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Contextualised gap-fill; grammar in context"], ["h2", "Activity", "#2F6FED"], ["p", "Practice Ex 5: Students complete the gapped text with the correct words (e.g. present continuous, a preposition collocation, be going to). Check with the class and ask why each answer is correct."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Practice Ex 5"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guided free writing; monitoring"], ["h2", "Activity", "#2F6FED"], ["p", "Practice Ex 6: Students write a paragraph of approximately 40–50 words about what they do in their free time. Monitor and note strengths and errors for feedback. Students’ own answers."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Practice Ex 6"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment – using the wordlist", "#7B5CE6"], ["p", "pairs test each other’s spelling; challenge students to write a short story using as many collocations as possible."], ["h2", "Remedial", "#D63A72"], ["p", "Grammar file SB p53 (Exs 1–8) for further practice of present simple and present continuous, adverbs of frequency and time phrases; students refer to the wordlist and page references to find where items were presented."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Class feedback on answers"], ["h2", "Activity 2", "#D63A72"], ["p", "Check answers; students refer to wordlist"], ["h2", "Activity 3", "#D63A72"], ["p", "Self-check by listening; class justifies choices"], ["h2", "Activity 4", "#D63A72"], ["p", "Class feedback – reasons for answers"], ["h2", "Activity 5", "#D63A72"], ["p", "Monitor writing; teacher feedback"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Explain that the next unit is called Connections. Ask what connections means (joining points between people or things) and explain that they will look at languages and communication and how they help make connections between people."], ["h2", "Reflect on learning", "#E5504D"], ["p", "students look back through the unit and choose the most useful grammar point, the three most useful vocabulary items and the most interesting piece of information; compare in pairs."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Finish the Practice exercises for revision if not completed in class."], ["li", "Workbook p19 (Exs 1–6: blog post gap-fill, questions, sentences, adjectives, multiple-choice article, gap-fill)."], ["li", "Grammar file SB p53."], ["li", "Revise for the Unit 1 test."]]}]}]}, {"n": "Connections", "l": [{"n": "Lesson 1 – Reading", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "CONNECTIONS"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 1 – Reading"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "read short texts (a notice and a message) and choose the correct option by looking for synonyms;"], ["li", "read a long article and answer multiple-choice questions on detail and on the writer’s main point;"], ["li", "work out the meaning of new words from definitions and context;"], ["li", "discuss for and against saving minority languages, giving reasons."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "vocabulary about languages – slightly, occurred, realised, allowed me, discovered, alive, at risk, original"], ["li", "talking about the importance of languages."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board and explain what students will do. Write: a country (S), a language (C), a currency (R), a capital city (A). In teams, students have three minutes to write one thing for each category beginning with the letter in brackets. 2 points for an answer no other team has, 1 point for a shared answer; the team with most points wins."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Predicting; true/false quiz; pair work"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Write Zulu, Inuktitut, Gaelic, Maori, Welsh on the board; elicit that they are languages and where each is spoken. Pairs decide if the quiz statements are true or false."], ["p", "Ex 2: Students check on SB p58 (all are true) and say which fact is most surprising."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Student’s Book (SB) pp25–27, p58"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Personalised discussion (mixed nationalities); text-type recognition"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3: Pairs discuss the questions (pair students of different nationalities if the class is multilingual); a few share ideas."], ["p", "Ex 4: Check the meaning of low grades. Students identify the two text types (a school notice and a phone message). Audio version available."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3–4; audio"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Exam-task strategy; looking for synonyms; justifying answers"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5 (practice task – multiple choice, short texts): Make it clear that all the information in the correct option must match the notice/message; options use different words, so students look for synonyms. Pairs compare and justify; class feedback on why the wrong answers are wrong (1 C, 2 B)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5; Practice Guide (PG) p63 (walkthrough p62)"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Predicting from a heading; reading for main idea; study tip"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 6: Students read the heading and predict the text; read the article to check and answer the two questions (English, French, Cree, Ojibwe, Inuktitut)."], ["p", "Ex 7: Explain that Qs 1–4 test detail but Q5 tests the whole text; read the study tip; pairs discuss the answer (if languages die out, we lose stories, traditions and memories)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 6–7; PG p67 (walkthrough p66)"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Underlining key words; matching text to questions; guessing meaning from definitions"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 8 (practice task – multiple choice, long text): Students underline key words in each question (Qs 1–4 follow the order of the text), do the task, discuss in pairs; check with the class."], ["p", "Ex 9: Students find words from definitions (slightly, occurred, realised, allowed me, discovered, alive, at risk, original); check meaning and pronunciation."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 8–9; PG p67"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Summarising; structured debate; giving reasons"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 10 – Sum up: Students note answers to the questions and discuss in pairs (fast finishers write 2–3 lines: The writer believes that … because …)."], ["p", "Ex 11 – Speak: Groups of 4–6 split in two – one half argues for saving minority languages, the other against. Give prompts (culture, money, time, technology, ability to communicate). Read the Fun footer."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 10–11; Fun footer"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment", "#7B5CE6"], ["p", "Extra – students search online for other surprising facts about languages and share them. Fast finishers write a two- or three-line summary of the article starting The writer believes that … because …"], ["h2", "Remedial", "#D63A72"], ["p", "Give prompts and example ideas for the debate (e.g. Against: loss of culture, music, stories, history; For: too expensive, other things more important) and let students choose options carefully before the practice tasks."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Class feedback; students share the most surprising fact"], ["h2", "Activity 2", "#D63A72"], ["p", "Peer learning – pair work; class feedback"], ["h2", "Activity 3", "#D63A72"], ["p", "Pairs justify answers; class feedback"], ["h2", "Activity 4", "#D63A72"], ["p", "Class feedback on the main-point question"], ["h2", "Activity 5", "#D63A72"], ["p", "Pairs discuss; class check of answers and pronunciation"], ["h2", "Activity 6", "#D63A72"], ["p", "Monitoring – Sum up (Ex 10) and Speak (Ex 11)"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "In groups, students are given a minority language from the Ex 1 notes to research (how many people speak it, why it is important, will it die out?). In class, form new groups (one student from each), share the research, agree on one language to be saved and present the reasons to the class."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What was the most interesting thing you learnt? What else would you like to find out?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook pp20–21 (Exs 1–6: vocabulary gap-fill and matching, notices/emails multiple choice, blog reading)."], ["li", "Practice Guide p63 and p67."], ["li", "Flipped classroom: share the Unit 2 grammar presentation slides for the next lesson."]]}]}, {"n": "Lesson 2 – Grammar", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "CONNECTIONS"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 2 – Grammar"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "use the past simple for completed actions and the past continuous for actions in progress at a time in the past;"], ["li", "form the past continuous with was/were + -ing and spell -ing forms correctly;"], ["li", "recognise stative verbs that are not used in the continuous;"], ["li", "talk about what they were doing at times in the past."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "past simple and past continuous (While I was chatting with some local teenagers, I realised…)"], ["li", "the -ing form"], ["li", "stative verbs (understand, want, hear, realise, love) not used in the continuous."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Write this sentence from the reading text with the verbs underlined: While I was chatting with some local teenagers, I realised that my French skills were useful. Ask what tenses the underlined words are (past continuous and past simple)."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Recalling the reading text; class discussion"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Students think about the rest of the article and answer the questions as a class (he realised on a family trip in France while chatting to local teenagers)."], ["h2", "Time", "#C25E00"], ["p", "3 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p28"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive grammar; pair discussion; reference tables"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2 – Explore grammar 1: Students read the box and discuss the questions in pairs. Make sure they are clear about when each tense is used and how it is formed; refer them to the form tables on SB p54."], ["h2", "Time", "#C25E00"], ["p", "7 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p28; Grammar file SB p54; Grammar presentation slides Unit 2"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Predicting; listening for detail (video/audio)"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3 (2.01): Students read the three questions and predict what the teenagers might say (e.g. I was having dinner). Play the video/recording; elicit answers (A and B)."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio/video 2.01"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Modelling then independent practice; monitoring; checking by listening"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4 (2.01): Do the first item as a class. Students complete the rest; monitor how well they form the verbs and select the tense. Pairs discuss; play again to check; deal with common issues."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "Audio 2.01; SB Ex 4"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guided discovery of stative verbs; reading in context"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5 – Explore grammar 2: Write know, like, hate, look, hear – ask what they have in common in the past continuous; students read the box and answer (didn’t understand – a stative verb)."], ["p", "Ex 6: Describe the photo, predict from the title, read the article and choose verb options; pairs discuss; elicit other stative verbs. Watch out for: spelling of -ing forms (come – coming, stop – stopping, die – dying)."], ["h2", "Time", "#C25E00"], ["p", "9 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5–6; Grammar file SB p54"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Personalised speaking; peer work"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 7: Pairs discuss the questions; elicit answers from a few students and find out if others agree."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 7"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment (game)", "#7B5CE6"], ["p", "Write one true and one false sentence about last week (past simple + past continuous); students ask questions and guess. They write their own sentences and swap with a partner to guess which is true; fast finishers write one or two more."], ["h2", "Remedial / mixed ability", "#D63A72"], ["p", "replay 2.01 – students note what they hear about takeaway, a film, photographs, football team, shopping, breakfast (higher-ability students listen for all six). Assign Grammar file Exs 1–5 on SB p55 by ability (the exercises increase in difficulty)."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Whole-class questions"], ["h2", "Activity 2", "#D63A72"], ["p", "Class feedback; answer students’ questions"], ["h2", "Activity 3", "#D63A72"], ["p", "Elicit answers from the class"], ["h2", "Activity 4", "#D63A72"], ["p", "Monitoring verb forms; pair discussion"], ["h2", "Activity 5", "#D63A72"], ["p", "Pair discussion; class feedback on tense choice"], ["h2", "Activity 6", "#D63A72"], ["p", "Peer learning – pair work (Ex 7)"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "Pairs tell each other what they were doing at these times yesterday: 6.00 a.m.; 7.30 a.m.; 5 p.m.; 6.30 p.m.; 8 p.m.; 10 p.m.; 12 p.m., and find out if their days were similar or different."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What new things did you learn about past tenses? How will you use them? Pairs discuss; share."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p22 (Exs 1–6: past simple table, past continuous, W2.01 listening, own sentences, conversation gap-fill)."], ["li", "Grammar file SB pp54–55 (Exs 1–5)."], ["li", "Photocopiable 2A."]]}]}, {"n": "Lesson 3 – Vocabulary", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "CONNECTIONS"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 3 – Vocabulary"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "use verbs of language and communication correctly (say/tell, speak/talk, listen/hear);"], ["li", "use verb + preposition collocations (listen to, talk to/about, speak to, explain to);"], ["li", "complete a multiple-choice cloze practice task;"], ["li", "talk about communication and language difficulties using the new vocabulary."]]}, {"t": "Concepts", "i": "🗣️", "c": "#D63A72", "b": [["li", "repeat, say, translate, mean, speak, pronounce, understand, explain, tell, talk, listen, hear"], ["li", "listen to, talk to/about, speak to, explain (something) to (someone)."]]}, {"t": "Warm up Activity", "i": "🚀", "c": "#C98A00", "b": [["p", "Write the lesson aims on the board. Closed books. Write Communication on the board and elicit one or two verbs (e.g. speak, understand). In pairs students have two minutes to think of as many more verbs as they can. Elicit ideas and write them on the board (or invite students to write them)."], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "School Activities/ Lesson Procedures", "i": "🧩", "c": "#0F8FA6", "b": [["h1", "Activity 1", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Personalised discussion; eliciting ideas"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 1: Give thinking time, then pairs discuss the questions (ways to communicate without a shared language; apps that help); brief class discussion (e.g. gestures, pictures, translation apps)."], ["h2", "Time", "#C25E00"], ["p", "4 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB p29"], ["h1", "Activity 2", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Guessing meaning; dictionary use; listening to check"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 2 (2.02): Pairs discuss how the verbs differ in meaning (dictionary allowed); students complete the sentences alone; class feedback (repeat, say, translate, means, speak, pronounce, understand, explain)."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 2; Audio 2.02"], ["h1", "Activity 3", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Inductive language work; error awareness"], ["h2", "Activity", "#2F6FED"], ["p", "Explore language: write listen, talk, speak, explain on the board; students guess the prepositions, then read the explore language box. Write I said him / to him that he was wrong. I told them / to them he was wrong – which is correct? (a common error)."], ["h2", "Time", "#C25E00"], ["p", "5 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB explore language box; board"], ["h1", "Activity 4", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Modelling; using a dictionary to check collocations; pair comparison"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 3: Explain that the pairs of verbs are problems of collocation, not meaning. Do no. 1 as a class and elicit why. Students may look up the noun in a dictionary to see the collocation. Pairs discuss; class feedback."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 3; dictionary"], ["h1", "Activity 5", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Skimming; exam-task strategy; justifying answers"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 4 (practice task – multiple-choice cloze): Students read the article quickly and compare it with their ideas from Ex 1; then complete the task. Pairs discuss answers; class feedback (translate, spoke, explain, repeat, pronounce, understand)."], ["h2", "Time", "#C25E00"], ["p", "8 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 4; PG p71 (walkthrough p70)"], ["h1", "Activity 6", "#0F7F94"], ["h2", "Strategies / Methods", "#7B5CE6"], ["p", "Modelling; small-group speaking; follow-up questions"], ["h2", "Activity", "#2F6FED"], ["p", "Ex 5 – Speak: Demonstrate by telling the class your answers and inviting follow-up questions. Give a minute to think; groups share ideas; one or two students report what they learnt about their partner."], ["h2", "Time", "#C25E00"], ["p", "6 min"], ["h2", "Materials / Resource", "#178A55"], ["p", "SB Ex 5"], ["h1", "Enrichment / Remedial tasks", "#0F7F94"], ["h2", "Enrichment / mixed ability", "#7B5CE6"], ["p", "Higher-ability students cover the words at the top of Ex 2 and try to complete the sentences without them. Game: a student chooses a word and you give a sentence (sometimes with an error, e.g. I can speak all the words in our national anthem); students listen and correct in pairs for three minutes. Extra (WB): discuss what is difficult about being in a country where people speak a different language, and how to overcome it."]]}, {"t": "Formative assessment", "i": "🌟", "c": "#7B5CE6", "b": [["h2", "Activity 1", "#D63A72"], ["p", "Brief class discussion"], ["h2", "Activity 2", "#D63A72"], ["p", "Class feedback; students give meanings"], ["h2", "Activity 3", "#D63A72"], ["p", "Students choose the correct option"], ["h2", "Activity 4", "#D63A72"], ["p", "Class feedback – reasons for choices"], ["h2", "Activity 5", "#D63A72"], ["p", "Pairs discuss; class feedback"], ["h2", "Activity 6", "#D63A72"], ["p", "Peer learning – pair work; note errors"]]}, {"t": "Closing Assessment", "i": "🏁", "c": "#E5504D", "b": [["p", "In pairs or small groups, students create a short story using as many of the Ex 2 verbs as possible (five minutes). Then they work in a new pair/group and take turns telling their stories; listeners note which Ex 2 words they hear to see who used the most."], ["h2", "Reflect on learning", "#E5504D"], ["p", "What new verbs did you learn? How will you record them?"], ["h2", "Time", "#C25E00"], ["p", "5 min"]]}, {"t": "Homework", "i": "📚", "c": "#3B4CCA", "b": [["li", "Workbook p23 (Exs 1–6: definitions from the blog, conversations W2.02, gap-fill, Bangkok blog, own sentences)."], ["li", "Practice Guide p71 (multiple-choice cloze)."], ["li", "Photocopiable 2B."]]}]}, {"n": "Lesson 4 – Listening", "s": [{"t": "Lesson details", "i": "📋", "c": "#2F6FED", "b": [["h2", "Class", "#2F6FED"], ["p", "Grade 9"], ["h2", "Unit", "#2F6FED"], ["p", "CONNECTIONS"], ["h2", "Lesson", "#2F6FED"], ["p", "Lesson 4 – Listening"]]}, {"t": "Aims and learning outcomes", "i": "✅", "c": "#1E9E63", "b": [["h2", "By the end of the lesson, students will be able to:", "#178A55"], ["li", "predict the type of missing word (number, noun, feeling) before listening;"], ["li", "listen t
