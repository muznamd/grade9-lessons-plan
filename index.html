                aims: "By the end of the lesson, students will be able to: scan short profiles to find people’s hobbies and specific information; match six profiles to photo-board descriptions by finding matching key words (multiple matching); work out the meaning of new words from context (valley, cover, busy, background, stadium); summarise a profile and explain what they would put on their own photo board and why.",
                toStart: "Write the lesson aims on the board and explain what students will do. Write Identity – who are you? on the board and model it: tell the class who you are (e.g. I’m a father, a brother, an F1 fan, a chocolate lover…). In pairs, students come up with as many things as they can in two minutes that describe who they are. Class feedback: what did pairs have in common? (5 min)",

                    { time: "4 min", method: "Visual prompts; predicting; whole-class checking", details: "Ex 1: Focus on the photos. Students read the description and answer Qs 1–3 (what a photo board is, what the person might be like, what the photos show). Check as a class.", materials: "Student’s Book (SB) pp13–15", assessment: "Class feedback on answers to Qs 1–3" },
                    { time: "6 min", method: "Skimming and scanning with a time limit; eliciting key words", details: "Ex 2: Tell students they will read six profiles quickly for general understanding first. Time limit: 3 minutes to find each person’s hobbies. Check answers and elicit the key words in each profile (audio version available).", materials: "SB profiles (Osama, Hana, Basil, Kim, Riley, Cody); audio", assessment: "Check answers; elicit key words" },

                aims: "By the end of the lesson, students will be able to: use the present simple for habits/repeated actions and the present continuous for actions happening now; identify the tense in a recording or text and explain why it is used; understand verbs that can describe both states and actions (think, feel, see, have); talk about their routines and what they are doing at the moment.",
                toStart: "Write the lesson aims on the board. Write these questions: What are some things you do every day outside school? What is something you eat almost every day? What projects are you working on at the moment? What are you looking forward to at the moment? Pairs discuss. Monitor and assess use of the present tenses and any issues of use, form or pronunciation. A few students share what they learnt about their partner. (5 min)",

                aims: "By the end of the lesson, students will be able to: identify whether a question asks about agreement, a suggestion or feelings; listen to conversations about cities and choose the correct answer (multiple choice); use adverbs of frequency and time phrases in the correct position; ask and answer questions about habits and routines.",

        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btnElement.querySelector('i');
                icon.className = "fa-solid fa-check text-emerald-600";
                
                const toast = document.getElementById('toast');
                toast.classList.remove('translate-y-16', 'opacity-0');
                
                setTimeout(() => {
                    icon.className = "fa-regular fa-copy text-slate-400 group-hover:text-indigo-600";
                    toast.classList.add('translate-y-16', 'opacity-0');
                }, 2000);
            });
        }

        function renderLesson(lessonId) {
            const lesson = lessonsData.find(l => l.id === lessonId);
            if (!lesson) return;

            // Highlight active sidebar item
            document.querySelectorAll('.lesson-link').forEach(el => {
                if(parseInt(el.dataset.id) === lessonId) {
                    el.className = "lesson-link flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-colors shadow-sm";
                } else {
                    el.className = "lesson-link flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors";
                }
            });

            // Update mobile dropdown
            document.getElementById('mobile-lesson-select').value = lessonId;

            const container = document.getElementById('content-area');
            
            let activitiesHtml = lesson.activities.map((act, index) => `
                <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-lg space-y-1.5">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded">Activity ${index + 1} (${act.time})</span>
                        <span class="text-xs text-slate-500 font-medium">${act.materials}</span>
                    </div>
                    <p class="text-xs text-slate-800 whitespace-pre-line leading-relaxed">${act.details}</p>
                    <div class="text-[11px] text-slate-600 pt-1 border-t border-slate-200 flex items-center justify-between">
                        <span><strong>Method:</strong> ${act.method}</span>
                        <span><strong>Assessment:</strong> ${act.assessment}</span>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <!-- Lesson Header Title Card -->
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">${lesson.class}</span>
                            <span class="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Unit: ${lesson.unit}</span>

                        <h2 class="text-lg font-bold text-slate-900">${lesson.title}</h2>
                    </div>
                </div>

                <!-- Focus Skill & Target Language -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-bullseye text-indigo-600"></i> Focus Skill & Target Language
                        </h3>
                        <button onclick="copyToClipboard(this.getAttribute('data-text'), this)" data-text="${lesson.focusSkill.replace(/"/g, '&quot;')}" class="p-1.5 rounded-md hover:bg-slate-100 transition-colors group" title="Copy text">
                            <i class="fa-regular fa-copy text-slate-400 group-hover:text-indigo-600"></i>
                        </button>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-800 leading-relaxed">
                        ${lesson.focusSkill}
                    </div>
                </div>

                <!-- Aims / Learning Outcomes -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-flag-checkered text-indigo-600"></i> Aims / Learning Outcomes
                        </h3>
                        <button onclick="copyToClipboard(this.getAttribute('data-text'), this)" data-text="${lesson.aims.replace(/"/g, '&quot;')}" class="p-1.5 rounded-md hover:bg-slate-100 transition-colors group" title="Copy text">
                            <i class="fa-regular fa-copy text-slate-400 group-hover:text-indigo-600"></i>
                        </button>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-800 leading-relaxed whitespace-pre-line">
                        ${lesson.aims}
                    </div>

                <!-- To Start (Warm Up) -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-play text-indigo-600"></i> To Start (Warm Up)
                        </h3>
                        <button onclick="copyToClipboard(this.getAttribute('data-text'), this)" data-text="${lesson.toStart.replace(/"/g, '&quot;')}" class="p-1.5 rounded-md hover:bg-slate-100 transition-colors group" title="Copy text">
                            <i class="fa-regular fa-copy text-slate-400 group-hover:text-indigo-600"></i>
                        </button>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-800 leading-relaxed">
                        ${lesson.toStart}
                    </div>
                </div>

                <!-- Implementation of Approaches / Activities -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-list-check text-indigo-600"></i> Implementation of Activities & Strategies
                        </h3>
                        <button onclick="copyToClipboard(this.getAttribute('data-text'), this)" data-text="${lesson.activities.map(a => `[${a.time}]${a.method}: ${a.details} (Materials:${a.materials})`).join('\n\n').replace(/"/g, '&quot;')}" class="p-1.5 rounded-md hover:bg-slate-100 transition-colors group" title="Copy all activities">
                            <i class="fa-regular fa-copy text-slate-400 group-hover:text-indigo-600"></i>
                        </button>
                    </div>
                    <div class="space-y-3">
                        ${activitiesHtml}
                    </div>
                </div>

                <!-- Enrichment & Remedial Tasks -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-layer-group text-indigo-600"></i> Enrichment / Remedial Tasks (Differentiated)
                        </h3>
                        <button onclick="copyToClipboard(this.getAttribute('data-text'), this)" data-text="${lesson.enrichment.replace(/"/g, '&quot;')}" class="p-1.5 rounded-md hover:bg-slate-100 transition-colors group" title="Copy text">
                            <i class="fa-regular fa-copy text-slate-400 group-hover:text-indigo-600"></i>
                        </button>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-800 leading-relaxed whitespace-pre-line">
                        ${lesson.enrichment}
                    </div>
                </div>

                <!-- Finishing the Lesson -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                            <i class="fa-solid fa-flag text-indigo-600"></i> Finishing the Lesson
                        </h3>
                        <button onclick="copyToClipboard(this.getAttribute('data-text'), this)" data-text="${lesson.finishing.replace(/"/g, '&quot;')}" class="p-1.5 rounded-md hover:bg-slate-100 transition-colors group" title="Copy text">
                            <i class="fa-regular fa-copy text-slate-400 group-hover:text-indigo-600"></i>
                        </button>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-800 leading-relaxed">
                        ${lesson.finishing}
                    </div>
                </div>

                <!-- Homework & Teacher Comments Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-6">
                    <!-- Homework -->
                    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                                <i class="fa-solid fa-house-laptop text-indigo-600"></i> Homework
                            </h3>
                            <button onclick="copyToClipboard(this.getAttribute('data-text'), this)" data-text="${lesson.homework.replace(/"/g, '&quot;')}" class="p-1.5 rounded-md hover:bg-slate-100 transition-colors group" title="Copy text">
                                <i class="fa-regular fa-copy text-slate-400 group-hover:text-indigo-600"></i>
                            </button>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-800 leading-relaxed">
                            ${lesson.homework}
                        </div>
                    </div>

                    <!-- Teacher's Comments -->
                    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                                <i class="fa-solid fa-comments text-indigo-600"></i> Teacher’s Comments
                            </h3>
                            <button onclick="copyToClipboard(this.getAttribute('data-text'), this)" data-text="${lesson.comments.replace(/"/g, '&quot;')}" class="p-1.5 rounded-md hover:bg-slate-100 transition-colors group" title="Copy text">
                                <i class="fa-regular fa-copy text-slate-400 group-hover:text-indigo-600"></i>
                            </button>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-800 leading-relaxed">
                            ${lesson.comments}
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize Navigation and Selectors
        document.addEventListener("DOMContentLoaded", () => {
            const navContainer = document.getElementById('lesson-nav');
            const mobileSelect = document.getElementById('mobile-lesson-select');

            lessonsData.forEach(lesson => {
                // Sidebar button
                const button = document.createElement('button');
                button.dataset.id = lesson.id;
                button.className = "lesson-link w-full text-left flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors";
                button.innerHTML = `<span>${lesson.title}</span> <i class="fa-solid fa-chevron-right text-[10px] opacity-60"></i>`;
                button.addEventListener('click', () => renderLesson(lesson.id));
                navContainer.appendChild(button);

                // Mobile option
                const option = document.createElement('option');
                option.value = lesson.id;
                option.textContent = lesson.title;
                mobileSelect.appendChild(option);
            });

            mobileSelect.addEventListener('change', (e) => {
                renderLesson(parseInt(e.target.value));
            });

            // Load Lesson 1 by default
            renderLesson(1);
        });
    </script>
</body>
